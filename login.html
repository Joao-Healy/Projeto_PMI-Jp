<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenith — Entrar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="Static/Style.css">
</head>
<body class="login-page">

    <div class="login-card">
        <a href="index.html" class="login-brand text-decoration-none">
            <img src="Static/img/logo.png" alt="Zenith" class="brand-mark">
            <span class="wordmark">Zenith</span>
        </a>

        <div class="login-header">
            <h1>Acesse sua conta</h1>
            <p>Sua rotina de alta performance te espera.</p>
        </div>

        <form action="confirmacao.html" method="GET" class="zenith-form">
            <div class="mb-3">
                <label for="email" class="form-label">E-mail</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="seu@email.com" required autofocus>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label">Senha</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-accent btn-full">Entrar na plataforma</button>
        </form>

        <div class="login-footer">
            <p class="mb-0">Ainda não faz parte? <a href="index.html">Criar conta</a></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
