
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zenith - Minhas Tarefas</title>

    <link rel="stylesheet" href="Static/Style.css">
</head>

<body>

    <header class="app-header"><a href="index.html" class="wordmark">Zenith</a><nav aria-label="Principal"><a href="tarefas.html" aria-current="page">Tarefas</a><a href="dashboard.html">Dashboard</a><a href="habitos.html">Hábitos</a></nav><div class="conta"><span id="sessao-status" role="status">Modo demonstração</span><a href="login.html" id="entrar">Entrar</a><button type="button" id="sair" hidden>Sair</button></div></header>
<main id="conteudo" class="tarefas-container">

        <h1>Minhas tarefas</h1><p role="note"></p>

        <p class="subtitulo">
            Organize suas tarefas e acompanhe seu progresso.
        </p>

        <section class="painel">

            <h2>Adicionar tarefa</h2>

            <form id="formulario">

                <label for="nome">Nome da tarefa</label>

                <input
                    type="text"
                    id="nome"
                    placeholder="Ex.: Estudar JavaScript"
                    maxlength="100"
                    required
                >

                <label for="categoria">Categoria</label>

                <select id="categoria" required>
                    <option value="">Selecione uma categoria</option>
                    <option value="Estudos">Estudos</option>
                    <option value="Trabalho">Trabalho</option>
                    <option value="Treino">Treino</option>
                    <option value="Pessoal">Pessoal</option>
                </select>

                <label for="data">Data de conclusão</label>

                <input
                    type="date"
                    id="data"
                    required
                >

                <button type="submit" class="adicionar">
                    + Adicionar tarefa
                </button>

                <button type="button" id="cancelar" hidden>Cancelar edição</button><p id="mensagem" role="status"></p>

            </form>

        </section>

        <section class="painel">

            <h2>Minhas tarefas</h2><button type="button" id="recarregar">Atualizar lista</button>

            <div class="filtros">

                <button
                    type="button"
                    class="filtro ativo"
                    data-filtro="todas"
                >
                    Todas
                </button>

                <button
                    type="button"
                    class="filtro"
                    data-filtro="pendentes"
                >
                    Pendentes
                </button>

                <button
                    type="button"
                    class="filtro"
                    data-filtro="concluidas"
                >
                    Concluídas
                </button>

            </div>

            <div id="lista"></div>

            <p id="contador">0 tarefas</p>

            <button type="button" id="limpar" class="limpar">
                Limpar concluídas
            </button>

        </section>


    </main><footer>Zenith — sua rotina otimizada</footer>

    <script src="Static/js/api.js" defer></script>

<script src="Static/js/tarefas-api.js" defer></script>
<script src="Static/js/tarefas.js" defer></script>


</body>
</html>
