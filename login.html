<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenith — Entrar</title>
    <link rel="stylesheet" href="Static/Style.css">
</head>
<body class="login-page">

    <div class="login-card">
        <div class="login-brand">
            <a href="index.html" class="logo">ZENITH</a>
            <span>✦ Evolução Contínua</span>
        </div>

        <div class="login-header">
            <h1>Acesse sua conta</h1>
            <p>Sua rotina de alta performance te espera.</p>
        </div>

        <form action="#" method="POST" class="zenith-form">
            <div class="input-field">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="seu@email.com" required autofocus>
            </div>

            <div class="input-field">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-full">Entrar na plataforma</button>
        </form>

        <div class="login-footer">
            <p>Ainda não faz parte? <a href="index.html">Criar conta</a></p>
        </div>
    </div>

</body>
</html>
