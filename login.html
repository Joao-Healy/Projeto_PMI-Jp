<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenith — Entrar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="Static/Style.css">
</head>
<body class="login-page">

    <main id="conteudo" class="login-card">
        <a href="index.html" class="login-brand text-decoration-none">
            <img src="Static/img/logo.png" alt="Zenith" class="brand-mark">
            <span class="wordmark">Zenith</span>
        </a>

        <div class="login-header">
            <h1 id="login-titulo">Acesse sua conta</h1>
            <p>Sua rotina de alta performance te espera.</p>
        </div>

        <form id="login-form" class="zenith-form">
<div id="nome-campo" hidden><label for="login-nome">Nome</label><input id="login-nome" class="form-control" maxlength="100" autocomplete="name"></div>
<label for="login-email">Email</label><input id="login-email" class="form-control" type="email" maxlength="254" autocomplete="username" required>
<label for="login-senha">Senha (10 a 128 caracteres)</label><input id="login-senha" class="form-control" type="password" minlength="10" maxlength="128" autocomplete="current-password" required>
<button type="submit" class="btn btn-accent btn-full">Entrar</button><p id="login-status" role="status"></p></form>
<button type="button" id="alternar-cadastro" class="btn btn-outline-zenith btn-full">Criar uma conta</button>
        <div class="login-footer">
            <p class="mb-0">Conheça o projeto: <a href="index.html">Página inicial</a></p>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="Static/js/api.js" defer></script><script src="Static/js/login.js" defer></script>
</body>
</html>
