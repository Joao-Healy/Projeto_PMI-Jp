
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenith — Entrar</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="Static/Style.css">
</head>

<body class="login-page">

    <main class="login-card">

        <a href="index.html" class="login-brand text-decoration-none">
            <img src="Static/img/logo.png" alt="Zenith" class="brand-mark">
            <span class="wordmark">Zenith</span>
        </a>

        <div class="login-header">
            <h1 id="login-titulo">Acesse sua conta</h1>
            <p>Sua rotina de alta performance te espera.</p>
        </div>

        <form id="login-form" class="zenith-form">

            <div id="nome-campo" hidden>
                <label for="login-nome">Nome</label>
                <input id="login-nome" class="form-control">
            </div>

            <label for="login-email">Email</label>
            <input id="login-email" type="email" class="form-control" required>

            <label for="login-senha">Senha</label>
            <input id="login-senha" type="password" class="form-control" required>

            <button type="submit" class="btn btn-accent btn-full">
                Entrar
            </button>

        </form>

        <button type="button" id="alternar-cadastro" class="btn btn-outline-zenith btn-full">
            Criar uma conta
        </button>

        <div class="login-footer">
            <p class="mb-0">
                Conheça o projeto:
                <a href="index.html">Página inicial</a>
            </p>
        </div>

    </main>

    <script src="Static/js/login.js" defer></script>

</body>
</html>
