<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Zenith • Inscrição concluída</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="Static/Style.css">
</head>

<body class="login-page">

  <div class="login-card text-center">

    <img src="Static/img/logo.png" class="brand-mark mb-3" width="70" alt="Logo Zenith">

    <div class="mb-4">
      <div class="bg-success rounded-circle d-inline-flex align-items-center justify-content-center"
           style="width:80px;height:80px;">
        <span style="font-size:42px;color:white;">✓</span>
      </div>
    </div>

    <h1 class="mb-3">Inscrição realizada!</h1>

    <p class="text-secondary mb-4">
      Seja bem-vindo ao <strong>Zenith</strong>.
      Sua vaga foi confirmada e você já pode baixar o aplicativo.
    </p>

    <div class="d-grid gap-3">

      <a href="Static/download/ZenithSetup.exe"
         class="btn btn-success btn-lg"
         download>
        Baixar para Windows
      </a>

      <a href="index.html" class="btn btn-outline-secondary">
        Voltar ao início
      </a>

    </div>

    <hr class="my-4">

    <small class="text-muted">
      Versão 1.0 • Gratuito para uso pessoal
    </small>

  </div>

</body>
</html>
